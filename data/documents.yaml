    body: |
      # Project Beta: API Integration Guide

      Project ID: project_beta
      Phase: Implementation
      Lead: user_emp_002
      Members: user_ext_001 (ExternalCo Integration Specialist)

      ## 개요
      Project Beta는 외부 파트너 API 통합 프로젝트로, BWCorp 내부 시스템과 협력사
      시스템 간 데이터 동기화를 담당합니다.

      ## 통합 대상 파트너
      - PartnerA: 재고 정보 (REST API, 분당 30회 한도)
      - PartnerB: 배송 추적 (Webhook 수신, IP whitelist 적용)
      - PartnerC: 결제 정산 (gRPC, mTLS 인증)

      ## 보안 요구사항
      - 모든 외부 통신은 회사 egress proxy 경유
      - API Key는 AWS Secrets Manager에서 동적 조회 (하드코딩 금지)
      - Webhook payload는 HMAC-SHA256 검증 필수

      ## 에러 처리 패턴
      - 재시도: Exponential backoff (1s, 2s, 4s, 최대 5회)
      - Circuit breaker: 60초 윈도우 50% 실패 시 30초 차단
      - Dead Letter Queue: 최종 실패 메시지 보존, 알람 발송

      ## 모니터링
      - Dashboard: Datadog `project_beta_integration`
      - 알람: PartnerA latency P99 > 5s, PartnerB 누락 > 1%

      상세 partner-별 spec은 별도 문서 (PARTNER-{A,B,C}-INTEG)에서 관리.
    expected_readers: [user_emp_002, user_ext_001]

