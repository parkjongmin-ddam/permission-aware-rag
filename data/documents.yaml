    category: hr
    sub_type: hr.policy
    sensitivity: public
    language: ko
    body: |
      # 재택근무 가이드라인 (2026)

      ## 적용 대상
      - 입사 6개월 이상 정규직
      - 보안 등급 1~3 업무 담당자 (4 이상은 사전 승인 필요)

      ## 근무 형태
      - 주 2일까지 재택 허용
      - 코어타임: 10:00 ~ 16:00 (Slack 응답 의무)
      - 화상회의 참여 시 카메라 ON 권장

      ## 보안 요구사항
      - 회사 지급 노트북만 사용 (개인 기기 X)
      - VPN 필수 연결
      - 공공 Wi-Fi에서 사내 시스템 접속 금지
      - 외부에서 출력·캡처 금지

      ## 신청
      HR 시스템 > 재택근무 신청. 매월 첫째 주에 다음 달 일정 등록.

      위반 시 재택근무 자격 일시 정지 및 인사 기록에 반영됩니다.
    expected_readers: [employee, team_lead, executive, security_officer, auditor, hr_specialist]

