  - id: DOC-014
    title: "Q3 2026 Threat Landscape Brief"
    category: security
    sub_type: security.threat_intel
    sensitivity: High
    language: mixed
    body: |
      # Q3 2026 Threat Landscape Brief

      Classification: Internal — security_officer only
      Author: user_sec_001
      Period Covered: 2026-07-01 ~ 2026-09-30

      ## 주요 트렌드
      1. 공급망 공격 증가: NPM·PyPI 패키지 변조 사례 Q2 대비 +40%. 사내 dependency scan 강화 필요.
      2. AI 기반 피싱 정교화: Voice cloning을 통한 임원 사칭 사례 국내에서도 보고 시작. 외부 입금·자료 요청 시 별도 채널 확인 절차 강화.
      3. 클라우드 권한 오남용: 국내 IT 기업 대상 IAM 미설정으로 인한 데이터 노출 사건 3건 보고.

      ## BWCorp 영향도
      - 공급망: Build 파이프라인에서 의존성 무결성 검증 도입 (Q4 작업)
      - 피싱: 임원 대상 simulation 훈련 Q4에 실시 예정
      - IAM: Q3 점검 결과 사내 정책 적정, 자동 회수(deprovisioning) 자동화 미흡 → Q4 개선 과제

      ## 권고
      Q4 보안 투자 우선순위: (1) Dependency security, (2) IAM 자동화, (3) 임원 보안 훈련

      상세 자료는 별도 첨부 (사내 위키 SEC-Q3-2026 페이지 참조).
    expected_readers: [security_officer]

