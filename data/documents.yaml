    body: |
      # Payment API v2 Specification

      Status: Stable
      Version: 2.3.1
      Base URL: https://api.bwcorp.local/payment/v2

      ## 인증
      - 모든 호출은 OAuth 2.0 Bearer Token 필요
      - Token 발급: POST /auth/token (Client Credentials Grant)
      - Token 만료: 1시간, refresh 별도 필요 없음 (재발급)

      ## 주요 엔드포인트

      ### POST /payments
      결제 요청 생성
      - Request: { amount, currency, customer_id, payment_method }
      - Response: { payment_id, status, created_at }
      - 응답 시간: P50 < 300ms, P99 < 1.5s

      ### GET /payments/{payment_id}
      결제 상태 조회 (캐시 권장 — 5분 TTL)

      ### POST /payments/{payment_id}/refund
      환불 요청 (멱등성 보장 — Idempotency-Key 헤더 필수)

      ## 에러 코드
      - 400 INVALID_REQUEST: 요청 형식 오류
      - 402 PAYMENT_FAILED: 결제 거절
      - 409 DUPLICATE_REQUEST: 중복 요청 (Idempotency 활용)
      - 429 RATE_LIMITED: 분당 100회 초과

      ## Sandbox 환경
      - URL: https://sandbox-api.bwcorp.local/payment/v2
      - 테스트 카드: 사내 위키 PAY-SANDBOX 참조

      문의: payment-team@bwcorp.local
    expected_readers: [employee, team_lead, executive, security_officer, contractor, auditor, hr_specialist]

