    body: |
      # BWCorp Infrastructure Architecture v3

      Last Updated: 2026-09-15
      Author: Tech Architecture Council
      Status: Approved

      ## 개요
      BWCorp 인프라는 AWS 멀티 리전(Seoul + Tokyo DR) 기반 마이크로서비스 아키텍처로
      운영됩니다. 본 문서는 v3 개정판 (2026)으로, 이전 v2 대비 컨테이너 기반 워크로드
      전환과 zero-trust 네트워크 도입이 주요 변경 사항입니다.

      ## 핵심 컴포넌트
      - Compute: AWS ECS Fargate (서비스 워크로드), EKS (데이터 파이프라인)
      - Storage: Aurora PostgreSQL (운영 DB), S3 (객체 스토리지), ElasticSearch (로그)
      - Networking: AWS Transit Gateway, Private Link 기반 내부 통신
      - Identity: ADFS + Keycloak (OIDC), AWS IAM Identity Center 연동

      ## 보안 원칙
      - 모든 서비스 간 통신 mTLS 적용
      - IAM 정책은 least-privilege 원칙
      - 외부 노출 엔드포인트는 WAF + CloudFront 경유 의무

      ## 변경 절차
      인프라 변경은 ArchOps Council 승인 필요 (월 1회). 긴급 변경은 user_sec_001
      우선 통보 후 사후 승인.

      상세 다이어그램과 컴포넌트별 spec은 사내 위키 ARCH-V3 페이지 참조.
    expected_readers: [user_emp_001, user_emp_003, user_tl_001, user_exec_001]

  - id: DOC-017
    title: "Microservices Communication Patterns"
    category: tech
    sub_type: tech.architecture
    sensitivity: Medium
    language: mixed
    body: |
      # Microservices Communication Patterns

      ## 통신 방식 분류
      BWCorp 마이크로서비스는 세 가지 통신 패턴을 표준으로 사용합니다.

      ### 1. 동기 REST (HTTP/2)
      - 사용 사례: 사용자 요청 응답, 즉시 결과 필요한 조회
      - 인증: 서비스 간 mTLS + Service Token (JWT)
      - Timeout: 기본 3초, 최대 10초

      ### 2. 비동기 Event (Apache Kafka)
      - 사용 사례: 도메인 이벤트, 감사 로그, 비동기 통지
      - Topic 명명: {domain}.{event_type}.{version} (예: payment.completed.v2)
      - Retention: 7일 (감사 관련은 30일)

      ### 3. 비동기 RPC (gRPC)
      - 사용 사례: 내부 백오피스, 데이터 파이프라인
      - 외부 노출 금지, VPC 내부 한정

      ## 안티 패턴 (금지)
      - 직접 DB 공유: 서비스 경계 위반
      - HTTP 폴링: Event 기반으로 대체
      - 동기 호출 체인 3단계 이상: 적절히 비동기화 필요

      ## 트러블슈팅
      - 서비스 간 latency 측정: Datadog APM
      - Event 추적: Kafka Connect → ElasticSearch

      본 패턴 위반 시 Architecture Review 거부 사유에 해당합니다.
    expected_readers: [user_emp_001, user_emp_003, user_tl_001, user_exec_001]

  - id: DOC-018
