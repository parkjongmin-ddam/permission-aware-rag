      # SSO Authentication API Guide

      본 가이드는 사내 애플리케이션이 BWCorp SSO와 통합하는 절차를 설명합니다.
      권한 위임 표준: OAuth 2.0 + OIDC. 레거시 시스템 한정 SAML 2.0 지원.

      ## 통합 시나리오

      ### 신규 웹 애플리케이션 (권장)
      - 프로토콜: OIDC Authorization Code Flow + PKCE
      - ID Provider: Keycloak (sso.bwcorp.local)
      - 클라이언트 등록: Architecture Review 후 user_sec_001에게 신청

      ### 레거시 시스템 (SAML 2.0)
      - ADFS 기반 통합 지원 (Single Sign-On, Single Log-Out)
      - 권장 사항: 2027년까지 OIDC 마이그레이션 계획 수립

      ## 핵심 엔드포인트
      - Authorization: GET /auth/realms/bwcorp/protocol/openid-connect/auth
      - Token: POST /auth/realms/bwcorp/protocol/openid-connect/token
      - UserInfo: GET /auth/realms/bwcorp/protocol/openid-connect/userinfo
      - Discovery: GET /.well-known/openid-configuration

      ## Claims 매핑
      표준 클레임 외 BWCorp 확장 클레임:
      - bwcorp_role:           employee | team_lead | executive | ...
      - bwcorp_department:     부서 코드
      - bwcorp_clearance:      권한 등급 (1~4)
      - bwcorp_project_scope:  프로젝트 ID 리스트 (contractor 한정)

      ## 보안 요구사항
      - Refresh Token rotation 의무 (재사용 시 세션 강제 종료)
      - ID Token에 민감 정보 포함 금지

      문의: identity-team@bwcorp.local (Tech Lead: user_tl_001)
