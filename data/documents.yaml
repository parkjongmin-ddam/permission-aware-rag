    parties: [user_exec_001]
    body: |
      # GDPR 적용 범위 법무 의견서 (ADV-2026-014)

      Date: 2026-08-22
      Prepared By: ExternalLawFirm Korea (GDPR Specialist Team)
      Reviewer: BWCorp Legal Counsel
      Addressee: user_exec_001 (Tech Division VP)
      Case ID: ADV-2026-014

      ## 의뢰 사항
      Project Gamma(2027 출시 예정 글로벌 IAM SaaS)의 GDPR(EU 일반개인정보보호규정)
      적용 범위 및 BWCorp가 부담해야 할 의무 사항.

      ## 결론 요약
      BWCorp는 GDPR 제3조 제2항 (a)호에 따라 GDPR의 영토적 적용 대상에 해당합니다.
      EU 거주자에게 직접 서비스를 제공할 경우 EU 내 사업장 부재와 무관하게 적용됨.

      ## 핵심 의무
      1. 데이터 컨트롤러/프로세서 지위 명확화: B2B 모델에서 고객사가 컨트롤러, BWCorp는
         프로세서일 가능성. DPA(Data Processing Agreement) 체결 필수.

      2. EU 대리인 지정: GDPR Art. 27. 한 회원국에 대리인 사전 지정 필요.
