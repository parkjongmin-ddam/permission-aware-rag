      # Project Alpha: Architecture Design

      Project ID: project_alpha
      Phase: Design (M2)
      Lead: user_tl_001
      Members: user_emp_001 (Backend), user_ext_001 (ExternalCo Consultant)
      Target Launch: 2026-Q4

      ## 목표
      기존 Monolith 결제 시스템을 마이크로서비스로 분해하고, Event-driven 아키텍처로 전환.

      ## 범위
      - Payment Core 서비스 분리 (Aurora → 도메인 분리 DB)
      - Settlement 서비스 신규 구축
      - Reconciliation 파이프라인 자동화

      ## 외부 협력
      ExternalCo (user_ext_001 포함 2명)는 결제 도메인 모델링 자문 및 마이그레이션
      전략 컨설팅 담당. 계약 기간: 2026-06-01 ~ 2026-09-30.

      ## Architecture 의사결정
      - ADR-001: Event Bus는 Kafka 사용 (대안: AWS SNS+SQS)
      - ADR-002: 보상 트랜잭션은 Saga 패턴 (Orchestration 방식)
      - ADR-003: 외부 PSP 통합은 Anti-corruption layer 도입

      ## 마일스톤
      - M1 (완료): 도메인 모델 정립
      - M2 (진행 중): 아키텍처 설계, ADR 확정
      - M3 (예정): 점진적 분해 (Strangler Fig 패턴)
      - M4 (예정): Legacy 제거

      상세 다이어그램과 ADR은 사내 위키 PROJECT-ALPHA 참조.
