    body: |
      # 2026 Salary Band Reference (Confidential)

      본 문서는 임원, hr_specialist, auditor만 열람 가능합니다.

      ## Engineering Track (KRW, 연봉 기준)
      - L1 (Entry):     45M ~ 55M
      - L2 (Mid):       55M ~ 75M
      - L3 (Senior):    75M ~ 100M
      - L4 (Staff):    100M ~ 140M
      - L5 (Principal):140M ~ 200M

      ## Operations Track (HR, Finance, Marketing, Legal)
      - O1: 40M ~ 50M
      - O2: 50M ~ 65M
      - O3: 65M ~ 90M
      - O4: 90M ~ 130M

      ## 결정 요인
      - 직무 레벨 (Title, Scope, Impact)
      - 시장 벤치마크 (연 1회 외부 조사 반영)
      - 개인 성과 평가 결과

      각 레벨 내에서 ±10% 범위에서 개별 책정. Promotion 시 즉시 신규 레벨 밴드 적용.

      문의: compensation@bwcorp.local
    expected_readers: [executive, hr_specialist, auditor]

  - id: DOC-005
    title: "Bonus Structure FY2026"
    category: hr
    sub_type: hr.compensation
    sensitivity: High
    language: ko
    body: |
      # 성과급(Bonus) 산정 기준 FY2026

      ## 구성
      연간 보상은 [기본급 12개월] + [성과급 (1~4개월분)]으로 구성됩니다.

      ## 산정 공식
      성과급 = 기본 월급 × 회사 성과 계수 × 개인 성과 계수

      - 회사 성과 계수: 0.5 ~ 1.5 (연간 매출/이익 목표 달성률, 임원회의 결정)
      - 개인 성과 계수: 0.0 ~ 1.5 (인사평가 등급 기준)
        - S: 1.5
        - A: 1.2
        - B: 1.0
        - C: 0.5
        - D: 0.0 (PIP 대상)

      ## 지급 시기
      - 50%: 1월 (전년도 성과 확정 후)
      - 50%: 7월 (Mid-year retention)

      ## 특이 사항
      - 입사 1년 미만: 비례 지급
      - 자발적 퇴사자: 지급일 기준 재직 중인 자에 한함
      - M&A·Strategic 보너스는 별도 정책 적용

      문의: compensation@bwcorp.local
    expected_readers: [executive, hr_specialist, auditor]

