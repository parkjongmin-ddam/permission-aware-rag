  - id: DOC-009
    title: "Password Policy v2.1"
    category: security
    sub_type: security.policy
    sensitivity: public
    language: ko
    body: |
      # BWCorp 비밀번호 정책 v2.1

      본 정책은 2026년 1월 1일부로 시행되며, BWCorp 모든 시스템 계정에 적용됩니다.

      ## 비밀번호 요구사항
      - 최소 12자 이상
      - 영문 대/소문자, 숫자, 특수문자 4종 중 3종 이상 조합
      - 사용자 ID, 이름, 사내 메일 도메인 포함 금지
      - 직전 5회 사용 비밀번호 재사용 금지

      ## MFA(다중요소 인증)
      - 모든 사내 시스템 접근 시 필수 적용
      - 인증 수단: OTP 앱(Microsoft Authenticator), 보안 키(YubiKey)
      - SMS 인증은 임원·VIP 계정에서 금지 (2026 강화 사항)

      ## 정기 변경
      - 일반 계정: 90일마다 변경
      - 관리자 계정: 60일마다 변경
      - 위반 시 자동 잠금

      ## 분실/유출 시 대응
      - 즉시 security-help@bwcorp.local 신고
      - 관련 계정 즉시 잠금 및 강제 비밀번호 초기화

      위반 사실 적발 시 정보보안 위반 행위로 인사 조치 대상입니다.
    expected_readers: [employee, team_lead, executive, security_officer, contractor, auditor, hr_specialist]

  - id: DOC-010
    title: "Information Security Code of Conduct"
    category: security
    sub_type: security.policy
    sensitivity: public
    language: ko
    body: |
      # BWCorp 정보보안 행동강령

      본 강령은 모든 임직원, 협력업체, 외주 인력에게 적용되며, 인사 평가 및 계약 갱신 시 준수 여부가 반영됩니다.

      ## 기본 원칙
      1. 회사 정보는 회사 자산이며, 업무 목적 외 사용을 금지합니다.
      2. 본인의 권한 범위 내에서만 데이터를 조회·처리합니다.
      3. 권한 외 데이터 접근이 발생한 경우 즉시 신고합니다.

      ## 금지 행위
      - 개인 클라우드(Google Drive, Dropbox 등)에 사내 자료 업로드
      - 회사 PC에 인가되지 않은 소프트웨어 설치
      - 회의 내용·문서를 외부로 무단 공유
      - 동료 계정 도용 또는 비밀번호 공유

      ## 신고 의무
      보안 위반·의심 행위 인지 시 24시간 이내 신고:
      - 채널: security-incident@bwcorp.local
      - 익명 신고도 가능 (사내 핫라인 #5500)

      ## 위반 시 조치
      경미 사안: 경고 및 재교육 / 중대 사안: 인사위원회 회부 / 형사 고발 가능 사안 포함

      본 강령은 매년 갱신되며, 갱신본 게시 시점부터 즉시 발효됩니다.
    expected_readers: [employee, team_lead, executive, security_officer, contractor, auditor, hr_specialist]

