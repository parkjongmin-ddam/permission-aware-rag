      # 개인정보보호법(PIPA) 컴플라이언스 보고서 2026

      Reporting Period: 2025-10-01 ~ 2026-09-30
      Compliance Lead: Legal Division
      External Counsel: ExternalLawFirm Korea
      Audit Reference: AUDIT-2026-PIPA-001

      ## 개요
      2026 개인정보보호법 개정안 시행(2026-03-15)에 따른 BWCorp의 적용 상태 및
      후속 조치 요약. 본 보고서는 이사회 및 감사위원회에 분기별 제출 자료의 H2 통합본임.

      ## 적용 범위
      - 개인정보 처리: 임직원 530명, 고객 사용자 약 28만명
      - 적용 시스템: HR 시스템, 고객 SaaS 플랫폼, Marketing CRM, Customer Support

      ## 주요 컴플라이언스 항목

      ### 1. 처리방침 개정
      - 2026-04-01부 신규 처리방침 시행 완료
      - 사용자 동의 재취득: 99.2% 완료 (잔여 0.8%는 계정 비활성)

      ### 2. 가명·익명처리
      - 마케팅 분석 목적 데이터는 익명화 처리 (식별 위험도 평가 완료)
      - 가명정보 결합 시 사전 영향평가 의무화 (Q3에 1건 수행)

      ### 3. 개인정보 영향평가(PIA)
      - Q2: 신규 ML 추천 시스템 도입 시 PIA 수행 (양호)
      - Q3: 외부 marketing tool 도입 검토 시 PIA 수행 (조건부 승인)

      ## 미해결 사안
      - 동남아 법인(베트남) 데이터 이전: 표준계약조항(SCC) 체결 진행 중
      - Legacy DB 보유 기간 초과 데이터 삭제: 2026-Q4 완료 예정

      ## 감사 의견
      중대한 위반 사항 없음. 위 미해결 사안의 Q4 완료 모니터링 필요.

