  - id: DOC-001
    title: "Employee Handbook 2026"
    category: hr
    sub_type: hr.policy
    sensitivity: Low
    language: ko
    body: |
      # BWCorp 직원 핸드북 2026

      BWCorp에 합류하신 것을 환영합니다. 본 핸드북은 2026년 1월 1일부터 적용되며,
      회사의 핵심 가치, 근무 정책, 복리후생 및 행동강령을 정리한 문서입니다.

      ## 핵심 가치
      - 신뢰: 동료, 고객, 파트너와의 모든 관계에서 정직하고 투명하게 행동합니다.
      - 전문성: 본인 분야에서 지속적으로 성장하며 최고 수준의 결과를 추구합니다.
      - 협업: 부서 간 경계를 넘나들며 함께 문제를 해결합니다.

      ## 주요 정책 개요
      근무 시간, 휴가, 재택근무, 출장, 경비처리 등 세부 정책은 별도 문서를 참조하십시오.
      인사 관련 문의는 HR Helpdesk(hr-help@bwcorp.local)로 연락 바랍니다.

      ## 행동강령
      모든 임직원은 회사 정보보안 정책 및 윤리강령을 준수해야 합니다. 위반 시
      인사위원회 회부 절차가 진행됩니다.

      본 문서는 매년 1월 개정되며, 변경 사항은 사내 공지 채널을 통해 안내됩니다.
    expected_readers: [employee, team_lead, executive, security_officer, contractor, auditor, hr_specialist]

  - id: DOC-002
    title: "Leave Policy v3.2"
    category: hr
    sub_type: hr.policy
    sensitivity: Low
    language: ko
    body: |
      # 휴가 정책 v3.2

      본 정책은 2026년 1월 1일부로 시행되며, BWCorp 정규직 임직원에게 적용됩니다.

      ## 연차 휴가
      - 입사 1년 미만: 월 1일씩 발생 (최대 11일)
      - 입사 1년 이상: 연 15일 부여
      - 3년차부터 2년마다 1일씩 추가 (최대 25일)

      ## 신청 절차
      1. HR 시스템에서 휴가 신청서 작성
      2. 직속 상사 승인 (1영업일 이내)
      3. 5일 이상 연속 휴가는 부서장 추가 승인 필요

      ## 병가
      연 5일 한도 내에서 유급 처리. 3일 이상은 진단서 제출 필요.

      ## 미사용 연차
      당해년도 미사용 연차는 익년도 2월 말일까지 사용 가능하며, 이후 자동 소멸합니다.

      문의: hr-help@bwcorp.local
    expected_readers: [employee, team_lead, executive, security_officer, contractor, auditor, hr_specialist]

  - id: DOC-003
    title: "Remote Work Guidelines"
    category: hr
    sub_type: hr.policy
    sensitivity: Low
    language: ko
    body: |
      # 재택근무 가이드라인 (2026)

      ## 적용 대상
      - 입사 6개월 이상 정규직
      - 보안 등급 1~3 업무 담당자 (4 이상은 사전 승인 필요)

      ## 근무 형태
      - 주 2일까지 재택 허용
      - 코어타임: 10:00 ~ 16:00 (Slack 응답 의무)
      - 화상회의 참여 시 카메라 ON 권장

      ## 보안 요구사항
      - 회사 지급 노트북만 사용 (개인 기기 X)
      - VPN 필수 연결
      - 공공 Wi-Fi에서 사내 시스템 접속 금지
      - 외부에서 출력·캡처 금지

      ## 신청
      HR 시스템 > 재택근무 신청. 매월 첫째 주에 다음 달 일정 등록.

      위반 시 재택근무 자격 일시 정지 및 인사 기록에 반영됩니다.
    expected_readers: [employee, team_lead, executive, security_officer, auditor, hr_specialist]

  - id: DOC-004
