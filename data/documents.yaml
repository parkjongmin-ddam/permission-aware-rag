      # Production Incident Response Playbook

      본 Playbook은 사내 production 시스템 장애 발생 시 대응 절차를 정의합니다.

      ## Severity 분류
      - SEV1: 사용자 가용성 50% 이상 영향, 즉시 대응 (5분 이내)
      - SEV2: 부분 기능 장애, 30분 이내 대응
      - SEV3: 성능 저하, 4시간 이내 대응
      - SEV4: 사용자 영향 없음 (개선 사항), 정기 처리

      ## 초기 대응 (모든 SEV)
      1. PagerDuty 알람 확인 및 On-Call 엔지니어 응답
      2. #incident-{service} Slack 채널 생성 (SEV1/2)
      3. Incident Commander 지정 (보통 On-Call 본인)
      4. Status Page 업데이트 (외부 사용자 영향 시)

      ## SEV1/2 추가 조치
      - 5분 이내: 관련 팀 호출, Slack #war-room 활성화
      - 15분 이내: 임원 brief (user_exec_001), 초기 영향 평가
      - 30분 이내: 외부 communication 결정 (마케팅·CS 협의)

      ## 복구 후 24시간 내
      - Postmortem 문서 작성 (Blameless 원칙)
      - Root Cause Analysis
      - Action Item 도출 (담당자 지정, 마감 명시)

      ## 자료
      - Postmortem 템플릿: 사내 위키 INC-TEMPLATE
      - 과거 사례 모음: incident.bwcorp.local/archive

      문의: sre-oncall@bwcorp.local
    expected_readers: [user_emp_001, user_emp_003, user_tl_001, user_exec_001]

  - id: DOC-021
    title: "Database Migration Procedures"
    category: tech
    sub_type: tech.runbook
    sensitivity: Medium
    language: mixed
    body: |
      # Database Migration Procedures

      ## 적용 범위
      Production Aurora PostgreSQL 데이터베이스의 스키마/데이터 변경 작업.

      ## 사전 요구사항
      - 마이그레이션 스크립트는 사내 표준 도구 사용 (Flyway 또는 Alembic)
      - 모든 변경은 멱등성 (idempotent) 보장
      - Rollback 스크립트 동시 작성 의무

      ## 변경 분류

      ### 호환성 변경 (Low Risk)
      - 신규 컬럼 추가 (NULL 허용 또는 DEFAULT 지정)
      - 신규 인덱스 추가 (CONCURRENTLY 옵션 필수)
      - 절차: 자동화 파이프라인 통과, On-Call 알림만

      ### 비호환 변경 (High Risk)
      - 컬럼 삭제, 타입 변경, NOT NULL 제약 추가
      - 절차:
        1. Architecture Review 승인
        2. 사전 dry-run (staging 환경)
        3. 점진적 배포 전략 (read+write 호환 기간 최소 1주)
        4. 변경 작업은 트래픽 저점 시간대 (월~목 02:00~04:00 KST)

      ## 백업 의무
      변경 직전 logical backup 수행. RPO 목표: 5분.

      ## Rollback 결정
      - 자동: 마이그레이션 실패 시 즉시
      - 수동: SEV1/2 장애 발생 시 user_tl_001 또는 user_exec_001 승인

      문의: dba-team@bwcorp.local
    expected_readers: [user_emp_001, user_emp_003, user_tl_001, user_exec_001]

