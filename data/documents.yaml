      Target Launch: 2026-Q4

      ## 목표
      기존 Monolith 결제 시스템을 마이크로서비스로 분해하고, Event-driven 아키텍처로 전환.

      ## 범위
      - Payment Core 서비스 분리 (Aurora → 도메인 분리 DB)
      - Settlement 서비스 신규 구축
