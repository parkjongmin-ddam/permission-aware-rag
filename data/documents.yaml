    body: |
      # SOC2 Type II Audit Report 2025

      Audit Firm: ExternalAuditFirm Korea
      Audit Period: 2025-01-01 ~ 2025-12-31
      Audit Engagement ID: AUDIT-2025-SOC2-001
      BWCorp Lead: user_sec_001
      External Auditor Lead: (redacted, 외부 감사 파트너)

      ## Scope
      - Security, Availability, Confidentiality (3 of 5 Trust Service Criteria)
      - Coverage: BWCorp 사내 모든 production 시스템 및 운영 프로세스

      ## 주요 발견 사항
      1. Effective Controls (94개 중 91개 통과)
         - 접근 제어, 변경 관리, 사고 대응 프로세스 적절히 운영
         - MFA 100% 적용 확인 (2025-06부터)

      2. Deficiencies (3건)
         - DEF-01: 비활성 계정 자동 회수가 부분적 (정책상 90일, 실제 일부 120일 초과)
         - DEF-02: Vendor 접근 권한 정기 재검토 주기 불일치
         - DEF-03: backup 복원 테스트 분기별 1회 → 실제 연 2회 수행

      ## 조치 계획
      - DEF-01: 2026 Q1까지 deprovisioning 자동화 완료
      - DEF-02: Vendor access review를 분기별 1회로 정기화 (이미 시행)
      - DEF-03: backup 테스트를 분기 1회로 강제 (Runbook 개정 완료)

      ## 결과
      Qualified Opinion — 위 3건 외 적정. 2026 차기 감사에서 Unqualified Opinion 달성 목표.
    expected_readers: [security_officer, auditor]
