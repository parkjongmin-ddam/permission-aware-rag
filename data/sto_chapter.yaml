- id: STO-077
  title: 주식·사채 등의 전자등록에 관한 법률 제19조제2호
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '주식·사채 등의 전자등록에 관한 법률 제19조제2호 계좌관리기관 다음 각 목의 어느 하나에 해당하는 자

    가. 「은행법」에 따라 인가를 받아 설립된 은행(같은 법 제59조에 따라 은행으로 보는 자를 포함한다)

    나. 「은행법」 제5조에서 은행으로 보는 신용사업 부문

    다. 「농업협동조합법」에 따른 농협은행

    라. 「한국산업은행법」에 따른 한국산업은행

