- id: STO-003
  title: 토큰증권 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[토큰증권] 토큰증권은 "새로운 증권"이 아니라 증권의 **새로운 발행 형태**다. 자본시장법의

    규율 대상은 어디까지나 "증권"이고 발행 형태(실물·전자·토큰)는 따지지 않기

    때문에, 어떤 권리가 증권에 해당하면 형태가 토큰이든 아니든 공시·인허가·불공정

    거래 금지 등 모든 증권 규제가 그대로 적용된다. 정비방안은 이를 "증권=음식,

    발행형태=그릇"으로 비유한다 — 그릇을 바꿔도 음식의 본질은 안 변하고, 아무

    그릇이나 쓸 수 없으며(법적 효력·요건 필요), 음식 종류에 따라 맞는 그릇이 다르다

    (비정형 증권엔 기존 전자증권이 부적합해 새 형태가 필요). 토큰증권을 허용하는

    목적은 규제 우회가 아니라, 조각투자처럼 기존 전자증권으로 담기 어려웠던 비정형·

    소액 권리를 손쉽게 증권화하고(발행 비용↓), 분산원장·스마트계약으로 기존 증권의

    발행·거래 효율까지 높이려는 데 있다(예: 비상장주식 주주파악, 비상장채권 소액

    발행·거래). 이 개념이 STO 제도 전체의 출발점인 이유는, 규제·플레이어·시스템

    요건이 모두 "이건 증권이다"라는 전제에서 파생되기 때문이다. 반대로 증권이 아닌

    디지털자산(가상자산)은 자본시장법 밖에 있고, 별도의 디지털자산 입법

    (디지털자산기본법)이 규율 대상이다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 01#요약
- id: STO-004
  title: 토큰증권 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[토큰증권] 데이터 표현(토큰) 계층만 바뀌고 접근제어 정책(자본시장법)은 동일하게 적용되는

    구조. IAM/시스템으로 치면 같은 권리 레코드를 다른 저장소·직렬화 포맷으로 옮기는

    것(예: 동일 데이터를 중앙 DB에서 분산원장으로 이관)에 가깝고, 저장 포맷이

    달라져도 그 레코드에 걸린 접근제어 정책(규제)은 그대로 붙어 있다. 즉 "포맷 변경 ≠ 정책 변경"이 핵심 불변식이다. 시스템 설계

    시 "토큰이니까 규제가 가벼울 것"이라는 가정은 성립하지 않으며, 오히려 KYC/AML·

    공시 연계 같은 컴플라이언스 컴포넌트를 처음부터 아키텍처에 넣어야 함을 의미한다.

    분산원장이라는 저장 계층(공부/公簿)의 신뢰 모델이 "단일 관리자"에서 "다중 노드

    검증"으로 바뀌는 점(→ [[계좌관리기관]])이 토큰증권 고유의 시스템적 변화다.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 01#엔지니어 관점
- id: STO-005
  title: 토큰증권 · 헷갈린 점 / 미해결 질문
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: "[토큰증권] - 토큰증권과 전자증권의 법적 관계 → 전자증권법을 개정해 토큰증권을 **전자증권의\n  한 형태**로 규정할 계획이며, 그러면 권리 추정력·제3자 대항력이\
    \ 부여됨 ([별첨] p.21).\n  (2023 방안 기준. 2026 최종 법안에서 편입 방식이 동일한지 확인 필요 *)\n- \"높은 유통성을 전제\"한다는 서술([별첨]\
    \ p.1)과 상장 시 기존 전자증권으로 전환\n  (분산원장 처리속도 한계, [별첨] p.10)의 관계 — 유통성 전제가 어디까지 실현되는지 *\n- 요약의 디지털자산기본법\
    \ 서술은 2023.2 방안 시점 기준 — 2026 현재 입법·시행\n  상태(통과·시행 여부, 정식 명칭) 재확인 필요 * (CLAUDE.md §5 버전 관리)"
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 01#헷갈린 점 / 미해결 질문
