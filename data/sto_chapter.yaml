- id: STO-038
  title: 수익증권 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[수익증권] 수익증권은 신탁에 재산을 맡기고 거기서 나오는 수익을 받을 권리(수익권)를 증권화한

    것이다. STO에서 중요한 것은 ''비금전신탁 수익증권'' — 부동산·미술품 같은 비금전

    재산을 신탁해 조각내 파는 형태로, 기존엔 발행 자체가 막혀 있다가 신탁업 발전방안

    으로 발행이 허용될 예정이다. 투자계약증권과 함께 장외거래중개업의 유통 대상이지만,

    결정적 차이는 도산절연이다: 수익증권은 신탁 구조상 도산절연이 되어 발행인이 망해도

    신탁재산이 보호되는 반면, 투자계약증권은 그렇지 않다. 그래서 규제 강도도 갈려,

    투자한도가 수익증권은 상대적으로 느슨하고 투자계약증권은 더 엄격하다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 08#요약
- id: STO-039
  title: 수익증권 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[수익증권] 수익증권은 ''기초자산(신탁재산)에 대한 청구권을 토큰화한 것''으로, 자산과 권리 사이에

    신탁이라는 격리 계층(isolation layer)이 하나 낀 구조다. 도산절연은 발행인의 장애가

    기초자산으로 전파되지 않게 하는 fault isolation(장애 격리)에 대응한다. 시스템으로

    치면 수익증권은 "격리된 리소스에 대한 접근권"이라 발행인 프로세스가 죽어도 자산

    상태가 보존되는 반면, 투자계약증권은 발행인과 직접 결합돼 발행인 장애가 곧 권리

    손상으로 이어진다 → 그래서 후자에 더 낮은 노출 한도(투자한도)를 건다.

    → [[투자계약증권]]과 대비.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 08#엔지니어 관점
- id: STO-040
  title: 수익증권 · 헷갈린 점 / 미해결 질문
