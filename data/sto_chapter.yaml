- id: STO-048
  title: 디지털증권시장 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[디지털증권시장] 디지털증권시장은 비정형 증권(투자계약증권·비금전신탁 수익증권)의 ''상장시장''이다.

    소규모 장외 유통은 장외거래중개업이 맡고, 다수 투자자가 참여하는 대규모 거래는 이

    KRX 디지털증권시장이 맡는 이원 구조다. 상장요건은 코넥스와 유사한 완화 수준으로

    초기 시장을 조성하되, 발행인 건전성·중요정보 공시는 적용한다. 결정적 특징은 상장 시

    분산원장을 기존 전자증권으로 전환한다는 점이다 — 분산원장의 처리속도 한계 때문에,

    대규모 거래는 검증된 기존 매매·청산·결제 인프라로 안정성을 확보한다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 10#요약
- id: STO-049
  title: 디지털증권시장 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[디지털증권시장] 장외거래중개업 vs 디지털증권시장은 처리량·신뢰 요구에 따라 다른 실행 경로로

    라우팅하는 이원화다(→ [[장외거래중개업]]). 상장 시 분산원장→전자증권 전환은

    "고TPS 경로에선 검증된 legacy 인프라로 폴백"하는 아키텍처 결정 — 혁신 계층(분산원장)을

    성능 임계에서 벗어던지고 안정 계층으로 스위칭한다. 상장요건 완화는 진입 장벽(정책

    게이트)을 코넥스 수준으로 낮춰 초기 유동성을 유도하는 것이다.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 10#엔지니어 관점
- id: STO-050
  title: 디지털증권시장 · 헷갈린 점 / 미해결 질문
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
