  body: 자본시장과 금융투자업에 관한 법률 제4조제4항 증권 이 법에서 "지분증권"이란 주권, 신주인수권이 표시된 것, 법률에 의하여 직접 설립된 법인이 발행한 출자증권, 「상법」에
    따른 합자회사·유한책임회사·유한회사·합자조합·익명조합의 출자지분, 그 밖에 이와 유사한 것으로서 출자지분 또는 출자지분을 취득할 권리가 표시된 것을 말한다.
