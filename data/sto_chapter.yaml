- id: STO-033
  title: 혁신금융서비스 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[혁신금융서비스] 혁신금융서비스는 "법·제도가 아직 없어 못 하는 사업을 한시적으로 열어주는" 규제

    샌드박스다. STO에서 핵심인 이유는, 전자증권법·자본시장법 개정 전에도 투자계약증권

    유통과 수익증권 발행·유통을 샌드박스로 미리 테스트하기 때문이다. 다만 토큰에

    전자증권법상 효력을 부여하는 것은 특례 대상이 아니라, 기존 전자증권과 1:1로

    매칭(미러링)하는 방식이 필요하다. 또 발행·유통 겸영은 원칙적으로 제한되나, 별도

    유통시장이 반드시 필요하고 겸영으로만 혁신 서비스가 가능하다고 인정되면 조건부·

    한시적으로 허용된다 — 실제로 조각투자 사업자들이 이 겸영 특례를 받고 있고,

    제도화 여부는 별도 검토 대상이다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 07#요약
- id: STO-034
  title: 혁신금융서비스 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[혁신금융서비스] 샌드박스는 프로덕션 정책을 우회하는 조건부·시한부 예외 경로(break-glass에 가까움)다.

    정식 규제(정책)를 배포하기 전에 제한된 스코프·기간으로 실검증하는 스테이징 환경에

    해당한다. "겸영 특례"는 평소 강제되는 SoD(→ [[발행유통분리]])를 특정 조건에서만

    임시 해제하는 예외 규칙이고, 만료 시 롤백(사업 중단) 리스크가 명시된다. 즉 통제된

    예외를 통해 혁신을 시험하고, 그 결과가 정식 정책 반영 여부의 근거 데이터가 된다.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 07#엔지니어 관점
