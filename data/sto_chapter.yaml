- id: STO-084
  title: 주식·사채 등의 전자등록에 관한 법률 제2조
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: 주식·사채 등의 전자등록에 관한 법률 제2조 정의 이 법에서 사용하는 용어의 뜻은 다음과 같다.
  expected_readers:
