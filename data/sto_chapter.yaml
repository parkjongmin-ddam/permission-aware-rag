  body: '주식·사채 등의 전자등록에 관한 법률 제2조제3호 정의 "전자등록계좌부"란 주식등에 관한 권리의 발생·변경·소멸에 대한 정보를 전자적 방식으로 편성한 장부로서 다음 각
