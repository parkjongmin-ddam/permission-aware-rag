  body: 증권성 판단 / 투자계약증권 (Investment Contract Security) | 분류:regulation | 법:자본시장법 제4조제6항(투자계약증권); 제3조제1항·제4조제1항(금융투자상품·증권);
    제5조(파생상품); 제2조(역외적용) | 출처:금융위 2023.2 토큰증권 가이드라인 [별첨] p.14~18, [보도] p.5~6 | 관련:토큰증권, 조각투자, 수익증권, 가상자산,
