- id: STO-053
  title: 분산원장 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[분산원장] 분산원장은 토큰증권의 기반 기술이다. 정비방안은 이를 "법적 효력이 부여되는 공부

    (公簿)"의 기재 방식으로 인정하되, 안정성을 위해 요건을 요구한다: 시간순 기록·사후

    조작 방지, 기록과 실제 거래의 동일성 입증, 복수 분산 장부에 동일 기록, 특수관계 없는

    계좌관리기관 다수 참여(노드 51% 이상이 특수관계 없는 다른 금융기관 등), 별도 가상자산

    불요, 분산원장에 적합한 권리만 등록, 개인정보·신용정보법 준수. 이 요건들이 "탈중앙

    이되 신뢰할 수 있는" 장부를 만든다. 특히 ''별도 가상자산 불요''는 핵심 제약이다 —

    토큰증권 거래에 가상자산 결제를 요구하면 요건 미충족이라 사실상 거래가 막힌다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 11#요약
- id: STO-054
  title: 분산원장 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[분산원장] 분산원장은 저장·합의 계층의 신뢰 모델을 ''단일 관리자''에서 ''다자 검증''으로 바꾼다

    (→ [[계좌관리기관]]). 요건을 시스템으로 읽으면: 조작 방지 = append-only + 무결성,

    동일성 입증 = reconciliation, 복수 장부 동일 기록 = replication, 특수관계 없는

    노드 51% = 비담합 quorum(Sybil/collusion 저항), 가상자산 불요 = 외부 토큰 의존성

    제거(공급망·시장교란 리스크 차단). 즉 퍼블릭 블록체인의 무허가·PoW가 아니라, 신뢰된

    기관들의 quorum 검증에 가까운 ''허가형 분산원장'' 설계다.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 11#엔지니어 관점
- id: STO-055
  title: 분산원장 · 헷갈린 점 / 미해결 질문
