- id: STO-076
  title: 주식·사채 등의 전자등록에 관한 법률 제19조제1호
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '주식·사채 등의 전자등록에 관한 법률 제19조제1호 계좌관리기관 「자본시장과 금융투자업에 관한 법률」에 따른 금융투자업자로서 다음 각 목의 어느 하나에 해당하는 자

    가. 증권에 관한 투자매매업자 또는 투자중개업자

    나. 신탁업자(집합투자재산을 보관·관리하는 신탁업자로 한정한다)'
