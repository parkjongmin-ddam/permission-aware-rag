  title: 자본시장과 금융투자업에 관한 법률 제4조제6항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: 자본시장과 금융투자업에 관한 법률 제4조제6항 증권 이 법에서 "투자계약증권"이란 특정 투자자가 그 투자자와 타인(다른 투자자를 포함한다. 이하 이 항에서 같다) 간의
    공동사업에 금전등을 투자하고 주로 타인이 수행한 공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 것을 말한다.
