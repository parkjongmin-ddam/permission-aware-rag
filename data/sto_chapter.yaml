- id: STO-043
  title: 조각투자 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[조각투자] 조각투자는 부동산·미술품·저작권처럼 통째로 사기 어려운 자산을 잘게 쪼개 여럿이

    나눠 투자하는 것이다. 금융위는 ''22.4 조각투자 가이드라인에서, 조각투자가 "공동사업의

    결과에 따른 손익을 귀속받는 계약상 권리"를 전제하므로 대체로 투자계약증권(§4⑥)에

    해당한다고 봤다. 즉 조각투자 상품은 대개 증권이고, 그러면 발행·유통에 자본시장법이

    전면 적용된다. STO 제도가 정비하려는 발행(전자등록)·유통(장외거래중개업) 수요의

    상당 부분이 이 조각투자에서 나온다. 다만 디지털자산 형태의 조각투자는 가이드라인의

    전제가 그대로 성립하는지 별도 판단이 필요하다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 09#요약
- id: STO-044
  title: 조각투자 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[조각투자] 조각투자는 자산을 fractional ownership 단위로 sharding한 뒤 각 지분을 증권으로

    발행하는 구조다. 시스템으로 치면 "큰 리소스를 잘게 나눠 다수 principal에게 분배하고,

    각 조각에 소유·수익 청구권을 부여"하는 것. 핵심은 이 조각이 ''증권이냐''인데, 판정

    기준은 [[증권성판단]](공동사업·손익귀속)이고, 증권이면 발행([[전자등록기관]]·

    [[계좌관리기관]])·유통([[장외거래중개업]]) 파이프라인을 그대로 탄다. 즉 조각투자는

    STO 파이프라인의 대표적 ''입력 워크로드''다.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 09#엔지니어 관점
- id: STO-045
  title: 조각투자 · 헷갈린 점 / 미해결 질문
  category: legal
