  sensitivity: internal
  language: ko
  body: "[조각투자] - 디지털자산 형태의 조각투자에 '22.4 가이드라인 전제가 그대로 적용되나 (별도 판단\n  필요, [별첨] p.16) *\n- 실물 자산 '공유권만'\
    \ 표시하고 발행인 기여 약속이 없으면 증권 아님 — 조각투자와의\n  경계는? ([별첨] p.18) *"
