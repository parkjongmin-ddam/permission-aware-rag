- id: STO-062
  title: 자본시장과 금융투자업에 관한 법률 제373조의2제1항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '자본시장과 금융투자업에 관한 법률 제373조의2제1항 거래소의 허가 금융투자상품시장을 개설하거나 운영하려는 자는 다음 각 호의 사항을 구성요소로 하여 대통령령으로 정하는
    시장개설 단위의 전부나 일부를 선택하여 금융위원회로부터 하나의 거래소허가를 받아야 한다.

    1. 매매의 대상이 되는 금융투자상품의 범위(증권 및 장내파생상품을 말하되, 증권 중 주권, 그 밖에 대통령령으로 정하는 것을 포함한다)

    2. 회원(거래소시장에서의 거래에 참가할 수 있는 자로서 제387조제1항의 회원관리규정에 따른 자를 말한다. 이하 같다)이 되는 자의 범위'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 자본시장법-제373조의2#제373조의2제1항
- id: STO-063
  title: 자본시장과 금융투자업에 관한 법률 제373조의2제2항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '자본시장과 금융투자업에 관한 법률 제373조의2제2항 거래소의 허가 제1항에 따라 거래소허가를 받으려는 자는 다음 각 호의 요건을 모두 갖추어야 한다.

    1. 「상법」에 따른 주식회사일 것

    2. 거래소허가 단위별로 1천억원 이상으로서 대통령령으로 정하는 금액 이상의 자기자본을 갖출 것

    3. 사업계획이 타당하고 건전할 것

    4. 투자자의 보호가 가능하고 금융투자상품시장을 개설·운영하기에 충분한 인력과 전산설비, 그 밖의 물적 설비를 갖출 것

    5. 정관, 회원관리규정·증권시장업무규정·파생상품시장업무규정·상장규정·공시규정·시장감시규정·분쟁조정규정, 그 밖의 업무에 관한 규정(이하 이 호 및 제373조의7에서 "정관등"이라
    한다)이 법령에 적합하고, 증권 및 장내파생상품의 공정한 가격 형성과 매매 그 밖의 거래의 안정성 및 효율성을 도모하며 투자자의 보호를 위하여 충분할 것

    6. 임원이 「금융회사의 지배구조에 관한 법률」 제5조에 적합할 것

    7. 대주주(제12조제2항제6호가목의 대주주를 말한다)가 충분한 출자능력, 건전한 재무상태 및 사회적 신용을 갖출 것

    8. 대통령령으로 정하는 사회적 신용을 갖출 것

    9. 이해상충방지체계를 구축하고 있을 것'
