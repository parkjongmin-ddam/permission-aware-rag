- id: STO-007
  title: 증권성 판단 / 투자계약증권 · 한 줄 정의
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[증권성 판단 / 투자계약증권] 증권성 판단은 권리의 **실질적 내용**을 기준으로 증권 여부를 개별 사안별로 가리는

    원칙이며, 투자계약증권은 "특정 투자자가 타인과의 공동사업에 금전등을 투자하고

    주로 타인이 수행한 공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리"(자본시장법

    §4⑥)이다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 02#한 줄 정의
- id: STO-008
  title: 증권성 판단 / 투자계약증권 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[증권성 판단 / 투자계약증권] 어떤 토큰이 규제 대상인지는 이름·형식·기술이 아니라 **권리의 실질**로 갈린다.

    가이드라인은 새 증권 개념을 만든 게 아니라(증권 정의는 이미 자본시장법 §4에 있음),

    투자계약증권 요건과 판단 예시를 구체화해 자율 점검을 돕는 문서다 — 법원을 기속하지

    않고, 판단·준수 책임은 발행·유통 당사자에게 있다. 6종 증권 중 채무·지분·수익·파생

    결합·증권예탁증권은 정형화돼 판단이 명확하지만, **투자계약증권**은 나머지에 해당하지

    않을 때 보충적으로 적용되는 **포괄주의** 개념이라 적용범위가 넓다. 그래서 디지털자산

    증권성 논쟁의 실질 전선은 대부분 투자계약증권 해당 여부에서 형성된다. 핵심 5요건은

    ① 공동사업(수평/수직적 공동성) ② 금전등 투자(법정통화 불요) ③ 주로 타인이 수행

    (발행인 노력이 성패를 좌우) ④ 손익을 귀속받는 계약상 권리 ⑤ 이익획득 목적이다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 02#요약
- id: STO-009
  title: 증권성 판단 / 투자계약증권 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[증권성 판단 / 투자계약증권] "선언된 타입"이 아니라 "실제 속성"으로 리소스를 분류하는 **attribute-based

    classification**과 같다. 발행인이 스스로 "이건 유틸리티 토큰"이라고 라벨을 붙여도

    (=self-asserted claim), 정책 엔진은 라벨을 신뢰하지 않고 실제 권리 속성(배당권·

    수익귀속·의무이행자 존재 여부)을 평가해 판정한다 — substance-over-form = "claim이

    아니라 실측 속성으로 authz 결정". 투자계약증권의 포괄주의는 명시 규칙에 안 걸리는

    케이스를 잡는 **fallback/catch-all rule**(default 정책)에 대응하고, 5요건은 그 룰의

    평가 조건(AND 결합에 가까움)이다. RAG 관점에선 이 요건·예시 구조가 "질문→해당 요건

    매핑"이라 law_ref 정확 매칭(BM25)과 요건 서술 의미검색(dense)이 함께 필요한 지점.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 02#엔지니어 관점
- id: STO-010
  title: 증권성 판단 / 투자계약증권 · 헷갈린 점 / 미해결 질문
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: "[증권성 판단 / 투자계약증권] - category는 regulation으로 확정(증권성 판단=제도·규제, entry-template 기준). 다만 02가\n  '판단원리(증권성\
    \ 판단) + 유형(투자계약증권)'을 묶고 있어, Phase 2에서 두 엔트리로\n  분리할지는 열린 문제 *\n- \"수평적/수직적 공동성\"의 경계 사례 — 투자자 간 수익\
    \ 관련성만 있고 발행인 노력이\n  약하면? ([별첨] p.16) *\n- 스마트계약으로 권리가 자동 이행되면 \"계약상 권리\"가 성립하나 → 발행인이 스마트계약\n  구현을\
    \ 약속했다면 발행인에 대한 계약상 권리로 해석 가능([별첨] p.16). 무발행인 DAO\n  토큰과의 경계는? *"
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
