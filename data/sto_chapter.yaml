- id: STO-023
  title: 장외거래중개업 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[장외거래중개업] 현행 증권 유통제도는 상장 주식시장 중심이라, 비상장주식을 빼면 장외시장 형성이

    허용되지 않았고 투자계약증권·수익증권은 유통제도 적용에서 배제돼 엄격한 매출공시

    규제만 받았다. 조각투자 등 비정형 증권의 다자간 거래 수요가 커지자, 이런 증권에는

    대규모 상장시장보다 소규모 장외시장이 적합하다는 판단에서 장외거래중개업을 신설한다.

    핵심 설계는 세 가지다. ① 발행·인수·주선한 증권은 중개 불가, 자기계약 금지(→ [[발행유통분리]]).

    ② 증권신고서 등을 낸 증권을 이 중개로 거래하면 매출공시 예외를 인정하되, 공시 예외

    소규모 시장이므로 일반투자자에 투자한도를 두고 도산절연이 안 되는 투자계약증권엔 더

    낮은 한도를 적용한다. ③ 인가 요건은 채권중개전문회사 수준을 감안해 자기자본·물적·

    인적 요건을 두고 증권 유형별 인가단위로 나눈다. 대규모 거래는 KRX 디지털증권시장

    (상장시장, §373의2)에서 이뤄지며, 이때는 분산원장을 기존 전자증권으로 전환해 검증된

    매매·결제 인프라를 쓴다. 기존 증권사는 §16의2 업무 추가등록으로 이 업을 겸할 수 있다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 05#요약
- id: STO-024
  title: 장외거래중개업 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[장외거래중개업] 본질적으로 **주문 매칭 엔진(order-matching)에 대한 인가·행위규제 계층**이다. 다자간

    상대매매 = 종목별 호가를 공표하고 매수·매도 호가가 일치하면 체결하는 매칭 로직. 여기에

    붙는 통제가 (a) 진입 통제 = 인가/추가등록(licensing, §16의2), (b) SoD = 발행·인수·주선

    종목 중개 차단·자기계약 금지, (c) exposure control = 일반투자자 투자한도(rate/quota

    limit, 리스크 높은 투자계약증권에 더 타이트한 한도), (d) 감시 = 이상거래 적출 전산화·

    불량회원 제재. 장외(소규모, 매출공시 면제) vs 상장(KRX, 대규모)의 이원화는 처리량·

    신뢰 요구에 따라 다른 실행 경로로 라우팅하는 것과 같다 — 상장 시 분산원장→전자증권

    전환은 "고TPS 경로에선 검증된 legacy 인프라로 폴백"하는 아키텍처 결정.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 05#엔지니어 관점
- id: STO-025
  title: 장외거래중개업 · 헷갈린 점 / 미해결 질문
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: "[장외거래중개업] - \"장외거래중개업\"과 보도자료의 \"장외투자중개업\" 표기 혼용([보도] p.9 vs 본문) — 최종\n  법령상 정식 명칭 확인 *\n- 투자한도\
    \ 구체 수치는 \"추후 단계적 확대 검토\"([QA] 나.Q2)로 미확정 — 2026 법안·시행령\n  확정치 확인 (버전 비교 대상) *\n- KRX ATS(대체거래소)와\
    \ 장외거래중개업/디지털증권시장의 관계 — 시장참여자 제한·시장감시\n  차이([QA] 나.Q2)의 제도적 위치 정리 필요 *"
  expected_readers:
