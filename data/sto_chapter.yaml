- id: STO-018
  title: 계좌관리기관 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[계좌관리기관] 기존 전자증권 체계에서는 계좌관리기관(증권사 등)이 계좌부를 **단독으로** 관리하고,

    발행인이 증권을 직접 등록하는 것은 불가능했다. 토큰증권은 분산원장에서 **여러 노드가

    기록을 검증**해 사후 조작·변경을 막을 수 있으므로, 신뢰성 요건을 갖춘 발행인이 자기

    증권을 직접 기재해도 법상 효력이 있는 공부(公簿)로 인정할 수 있다 — 이것이 "발행인

    계좌관리기관" 신설의 논리다. 요건을 못 갖춘 발행인이 배제되는 것은 아니고, 기존처럼

    증권사를 통해 발행하면 된다. 투자자 보호 장치도 유지된다: 오기재는 정정으로, 초과분

    피해는 전자증권법 시행령 §35(전자등록기관·계좌관리기관 연대 원리금 지급 후 구상)로

    보상하며, 투자계약증권은 발행액 비례 기금 적립을 검토한다. 증권성 판단과 별개로

    예탁결제원(KSD)의 발행심사(양도가능성·대체가능성·법령위반 여부 등 외형 심사)와 총량

    관리는 그대로 적용된다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 04#요약
- id: STO-019
  title: 계좌관리기관 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[계좌관리기관] 권위 있는 원장(authoritative record store, 공부)의 **신뢰 모델이 중앙집중에서

    분산 합의로 이동**하는 사례. 기존엔 증권사라는 단일 신뢰기관이 계좌부를 소유했다면,

    발행인 계좌관리기관은 발행인이 self-hosted 원장을 운영하되 "특수관계 없는 다른

    금융기관 등이 노드의 51% 이상 참여"하는 quorum으로 무결성을 담보한다 — 단일 관리자 IdP에서

    다자 검증(federated/quorum) 모델로 바꾸는 것과 유사. KSD 총량관리(암호화 명세 통보

    → 필요시 비교 검증)는 분산 시스템의 **reconciliation/audit** 컴포넌트, 시행령 §35

    연대책임은 데이터 무결성 위반 시의 **책임·복구(compensation) 정책**에 해당. 인력요건

    (법조인·증권사무·전산 각 2인)과 손해배상 기금은 운영 주체의 신뢰성 담보 장치.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 04#엔지니어 관점
- id: STO-020
  title: 계좌관리기관 · 헷갈린 점 / 미해결 질문
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: "[계좌관리기관] - \"발행인 계좌관리기관\"(신설) vs 기존 \"계좌관리기관\"(증권사 등)의 용어·권한 차이 — 같은\n  '계좌관리기관' 범주 안의 하위 유형인지,\
    \ 별개 인가인지 확인 *\n- 노드 51% 요건([QA] 가.Q3)과 분산원장 요건 4번(\"특수관계 없는 계좌관리기관 다수 참여\",\n  [별첨] p.12)의 관계 — 최소\
    \ 노드 수/구성 기준의 최종 확정치 *\n- 자기자본·물적설비·대주주·임원 요건은 \"추후 확정\"([별첨] p.12) — 2026 법안에서 확정된\n  수치가 있는지 (버전\
    \ 비교 대상) *"
