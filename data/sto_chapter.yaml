- id: STO-071
  title: 자본시장과 금융투자업에 관한 법률 제4조제7항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '자본시장과 금융투자업에 관한 법률 제4조제7항 증권 이 법에서 "파생결합증권"이란 기초자산의 가격·이자율·지표·단위 또는 이를 기초로 하는 지수 등의 변동과 연계하여
    미리 정하여진 방법에 따라 지급하거나 회수하는 금전등이 결정되는 권리가 표시된 것을 말한다. 다만, 다음 각 호의 어느 하나에 해당하는 것은 제외한다.

    1. 발행과 동시에 투자자가 지급한 금전등에 대한 이자, 그 밖의 과실(果實)에 대하여만 해당 기초자산의 가격·이자율·지표·단위 또는 이를 기초로 하는 지수 등의 변동과 연계된
    증권

    2. 제5조제1항제2호에 따른 계약상의 권리(제5조제1항 각 호 외의 부분 단서에서 정하는 금융투자상품은 제외한다)

    3. 해당 사채의 발행 당시 객관적이고 합리적인 기준에 따라 미리 정하는 사유가 발생하는 경우 주식으로 전환되거나 그 사채의 상환과 이자지급 의무가 감면된다는 조건이 붙은 것으로서
    제165조의11제1항에 따라 주권상장법인이 발행하는 사채

    3의2. 「은행법」 제33조제1항제2호부터 제4호까지의 규정에 따른 상각형 조건부자본증권, 은행주식 전환형 조건부자본증권 및 은행지주회사주식 전환형 조건부자본증권

    3의3. 「금융지주회사법」 제15조의2제1항제2호 또는 제3호에 따른 상각형 조건부자본증권 또는 전환형 조건부자본증권

    3의4. 「보험업법」 제114조의2제1항제1호에서 제3호까지의 규정에 따른 상각형 조건부자본증권, 보험회사주식 전환형 조건부자본증권 및 금융지주회사주식 전환형 조건부자본증권

    4. 「상법」 제469조제2항제2호, 제513조 및 제516조의2에 따른 사채

    5. 그 밖에 제1호부터 제3호까지, 제3호의2부터 제3호의4까지 및 제4호에 따른 금융투자상품과 유사한 것으로서 대통령령으로 정하는 금융투자상품'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 자본시장법-제4조#제4조제7항
- id: STO-072
  title: 자본시장과 금융투자업에 관한 법률 제4조제8항
