  title: 디지털증권시장 · frontmatter
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: 디지털증권시장 (Digital Securities Market) | 분류:institution | 법:자본시장법 제373조의2(거래소 허가) | 출처:금융위 2023.2
    정비방안 [별첨] p.10, [보도] p.10, [QA] 상장 Q1~Q2 | 관련:장외거래중개업, 투자계약증권, 수익증권, 전자증권
