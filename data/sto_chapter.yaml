- id: STO-028
  title: 전자등록기관 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[전자등록기관] 전자등록기관은 전자증권 제도의 ''중앙 장부 관리자''다. 계좌관리기관(증권사 등)이

    각자 고객계좌부를 관리한다면, 전자등록기관은 전체 발행·유통의 정합성을 책임진다.

    증권성 판단과는 별개로, 발행되는 증권이 외형 요건(양도가능성·대체가능성·법령

    위반 여부)을 갖췄는지 심사하고(발행심사), 투자자에게 배정된 총수량과 발행량을

    비교해 초과분을 통제한다(총량관리). 토큰증권에서도 이 발행심사·총량관리는 그대로

    적용되며, 요건을 갖춘 발행인 계좌관리기관이 분산원장에 직접 기재하더라도 KSD가

    총량을 검증한다. 즉 분산·탈중앙이 도입돼도 ''최종 정합성 보증'' 역할은 중앙 기관에

    남는다.'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 06#요약
- id: STO-029
  title: 전자등록기관 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[전자등록기관] 전자등록기관은 권위 있는 레지스트리(authoritative registry)이자 정합성 검증자다.

    계좌관리기관이 각자 계좌부(샤드/노드)를 관리한다면, 전자등록기관은 전역 불변식

    (총 발행량 = Σ 계좌 잔량)을 강제하는 reconciliation/audit 권한을 쥔다. 발행심사는

    스키마 검증(양도가능·대체가능 = 표준화된 자료형인지), 총량관리는 conservation

    invariant 체크에 대응한다. 기재가 분산원장으로 흩어져도(→ [[계좌관리기관]]) 이 중앙

    검증 노드는 남아, "탈중앙 저장 + 중앙 정합성 보증"의 하이브리드 신뢰 모델이 된다.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 06#엔지니어 관점
