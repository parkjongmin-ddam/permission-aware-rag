- id: STO-067
  title: 자본시장과 금융투자업에 관한 법률 제4조제3항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: 자본시장과 금융투자업에 관한 법률 제4조제3항 증권 이 법에서 "채무증권"이란 국채증권, 지방채증권, 특수채증권(법률에 의하여 직접 설립된 법인이 발행한 채권을 말한다.
    이하 같다), 사채권(「상법」 제469조제2항제3호에 따른 사채의 경우에는 제7항제1호에 해당하는 것으로 한정한다. 이하 같다), 기업어음증권(기업이 사업에 필요한 자금을 조달하기
    위하여 발행한 약속어음으로서 대통령령으로 정하는 요건을 갖춘 것을 말한다. 이하 같다), 그 밖에 이와 유사(類似)한 것으로서 지급청구권이 표시된 것을 말한다.
