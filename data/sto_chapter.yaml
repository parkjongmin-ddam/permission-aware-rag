- id: STO-065
  title: 자본시장과 금융투자업에 관한 법률 제4조제1항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '자본시장과 금융투자업에 관한 법률 제4조제1항 증권 이 법에서 "증권"이란 내국인 또는 외국인이 발행한 금융투자상품으로서 투자자가 취득과 동시에 지급한 금전등 외에 어떠한
    명목으로든지 추가로 지급의무(투자자가 기초자산에 대한 매매를 성립시킬 수 있는 권리를 행사하게 됨으로써 부담하게 되는 지급의무를 제외한다)를 부담하지 아니하는 것을 말한다. 다만,
    다음 각 호의 어느 하나에 해당하는 증권은 제2편제5장, 제3편제1장(제8편부터 제10편까지의 규정 중 제2편제5장, 제3편제1장의 규정에 따른 의무 위반행위에 대한 부분을 포함한다)
    및 제178조·제179조를 적용하는 경우에만 증권으로 본다.

    1. 투자계약증권

    2. 지분증권, 수익증권 또는 증권예탁증권 중 해당 증권의 유통 가능성, 이 법 또는 금융관련 법령에서의 규제 여부 등을 종합적으로 고려하여 대통령령으로 정하는 증권'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
