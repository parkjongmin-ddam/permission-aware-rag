- id: STO-013
  title: 발행-유통 분리 · 요약
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '[발행-유통 분리] 발행자가 자기 증권의 유통시장까지 운영하면 가격·정보·체결에서 자기 이익을 위해

    투자자를 해칠 수 있다. 그래서 발행·인수·주선한 증권은 스스로 유통(중개)할 수 없고

    자기계약도 금지된다. 이 원칙은 새로 만드는 (비금전신탁)수익증권·투자계약증권 장외

    시장에도 동일하게 적용된다. 기존 제도에서도 일반 증권사는 다자간 상대매매 시장운영이

    금지돼 있고, 종합금융투자사업자조차 "타인이 발행한 주식"에 한해서만 다자간 상대매매

    시장을 운영할 수 있다 — 즉 "내가 만든 것을 내가 파는 시장을 운영"하는 구조를 막는

    것이 핵심이다. 다만 예외로, 별도 유통시장이 반드시 필요하고 겸영을 통해서만 혁신

    서비스가 가능하다고 인정되면 금융규제 샌드박스에서 한시적 겸영이 허용될 수 있다

    (현재 조각투자 사업자들이 이 특례를 받고 있고, 제도화 여부는 별도 검토 중).'
  expected_readers:
  - employee
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  - contractor
  tags:
  - sto
  - 03#요약
- id: STO-014
  title: 발행-유통 분리 · 엔지니어 관점
  category: legal
  sub_type: legal.opinion
  sensitivity: internal
  language: ko
  body: '[발행-유통 분리] 전형적인 **Separation of Duties(SoD)** / 이해상충 통제다. 한 principal이 상호

    배타적이어야 할 두 역할(발행자 = 자산 생성자, 시장운영자 = 체결 권한 보유자)을 동시에

    갖지 못하게 하는 role mutual-exclusion 정책. 자기계약 금지 = self-dealing 차단

    (요청자와 승인자가 동일 주체면 거부). 시스템으로 구현하면 "발행 이력이 있는 종목"에

    대해 해당 주체의 중개 권한을 deny하는 정책 게이트가 된다. 샌드박스 겸영 예외는

    "break-glass" 권한처럼 조건부·한시적으로만 열리는 예외 경로. → [[장외거래중개업]]이

    이 원칙을 실제로 강제받는 인가 단위, [[계좌관리기관]]은 발행 측 주체.'
  expected_readers:
  - team_lead
  - executive
  - security_officer
  - hr_specialist
  tags:
  - sto
  - 03#엔지니어 관점
