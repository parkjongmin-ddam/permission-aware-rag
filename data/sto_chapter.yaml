- id: STO-060
  title: 자본시장과 금융투자업에 관한 법률 제110조제5항
  category: legal
  sub_type: legal.regulatory
  sensitivity: public
  language: ko
  body: '자본시장과 금융투자업에 관한 법률 제110조제5항 수익증권 수익증권에는 다음 각 호의 사항을 기재하고 신탁업자의 대표자가 이에 기명날인 또는 서명하여야 한다.

    1. 신탁업자의 상호

    2. 기명식의 경우에는 수익자의 성명 또는 명칭

    3. 액면액

    4. 운용방법을 정한 경우 그 내용

    5. 제103조제3항에 따른 손실의 보전 또는 이익의 보장에 관한 계약을 체결한 경우에는 그 내용

    6. 신탁계약기간

    7. 신탁의 원금의 상환과 수익분배의 기간 및 장소

    8. 신탁보수의 계산방법

    9. 그 밖에 대통령령으로 정하는 사항'
