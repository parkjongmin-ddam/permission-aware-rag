  body: 조각투자 (Fractional Investment) | 분류:concept | 법:자본시장법 제4조제6항(대체로 투자계약증권으로 판단); 조각투자 가이드라인('22.4.28)
    | 출처:조각투자 가이드라인('22.4.28); 금융위 2023.2 정비방안 [별첨] p.16, [보도] p.5~6 | 관련:투자계약증권, 증권성판단, 토큰증권, 수익증권
