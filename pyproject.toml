[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permission-aware-rag"
version = "0.1.0"
description = "A LangGraph-based RAG system with multi-dimensional permission filtering (RBAC + ReBAC + ABAC)"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Jongmin Park" },
]
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Database
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # Embedding & data loading
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "pyjwt>=2.10",
    # LangGraph / LangChain
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"