[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "permission-aware-rag"
version = "0.1.0"
description = "A LangGraph-based RAG system with multi-dimensional permission filtering."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Jongmin Park", email = "jongminoov@gmail.com"}
]
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Database — NEW
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    # LangGraph / LangChain
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/permission_aware_rag"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
